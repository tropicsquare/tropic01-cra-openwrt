# =============================================================================
# OpenVPN Client Configuration – TROPIC01 PKCS#11 Hardware Authentication
# =============================================================================
#
# This template demonstrates how to configure an OpenVPN client so that the
# private key and X.509 certificate used for TLS mutual-authentication never
# leave the TROPIC01 secure element.  Certificate and keypair generation is
# done once with the lt-util / pkcs11-tool utilities.
#
# File location : /etc/openvpn/tropic01-pkcs11-client.conf
#
# Prerequisites
# -------------
#  1. libtropic-pkcs11 package installed (provides /usr/lib/libtropic_pkcs11.so)
#  2. openvpn_openssl package installed (this very package)
#  3. A keypair generated on TROPIC01 slot 0 and a DER-encoded X.509 client
#     certificate written into TROPIC01 R-MEM slot 0 (see NOTES below).
#  4. The VPN server CA certificate available as /etc/openvpn/ca.crt
#
# Quick PKCS#11 ID enumeration
# ----------------------------
#  pkcs11-tool --module /usr/lib/libtropic_pkcs11.so -L   # list slots
#  pkcs11-tool --module /usr/lib/libtropic_pkcs11.so -O   # list objects
#
# The "ID" column (hex) printed by -O is what goes into pkcs11-id below,
# prefixed with the token label, e.g.:
#   pkcs11-id 'pkcs11:model=TROPIC01;manufacturer=TropicSquare;token=TROPIC01%20Token;id=%01;object=client-key;type=private'
#
# =============================================================================

# ---------------------------------------------------------------------------
# Client / TUN mode
# ---------------------------------------------------------------------------
client
dev tun
proto udp

# ---------------------------------------------------------------------------
# Remote server  ← change to your VPN gateway address and port
# ---------------------------------------------------------------------------
remote vpn.example.com 1194

# ---------------------------------------------------------------------------
# TLS / Crypto
# ---------------------------------------------------------------------------
# Server CA certificate (file-based – the CA public cert is not secret)
ca   /etc/openvpn/ca.crt

# TLS authentication extra layer (optional but recommended)
# tls-auth /etc/openvpn/ta.key 1

# Cipher / digest settings – must match server configuration
cipher AES-256-GCM
auth   SHA256

# ---------------------------------------------------------------------------
# PKCS#11 – TROPIC01 hardware-backed identity
# ---------------------------------------------------------------------------
#
# Point OpenVPN at the TROPIC01 PKCS#11 module.
pkcs11-providers /usr/lib/libtropic_pkcs11.so

# PKCS#11 URI for the client key/certificate stored in TROPIC01.
# Replace the 'id' and 'object' fields with the values reported by
# pkcs11-tool -O above.  The percent-encoded byte (%01) corresponds to
# ECC key slot 0; use %02 for slot 1, etc.
pkcs11-id 'pkcs11:model=TROPIC01;manufacturer=TropicSquare;token=TROPIC01%20Token;id=%01;object=client-key;type=private'

# Cache the slot login for 5 minutes (TROPIC01 does not require a PIN,
# but pkcs11-helper expects this setting to be present).
pkcs11-pin-cache 300

# Do NOT use file-based cert/key directives when using PKCS#11.
# cert and key directives are intentionally omitted here.

# ---------------------------------------------------------------------------
# Connection reliability
# ---------------------------------------------------------------------------
resolv-retry infinite
persist-key
persist-tun
nobind

# Keepalive: ping every 10 s, restart after 120 s silence
keepalive 10 120

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# verb 3  → normal operation
# verb 5  → detailed PKCS#11 negotiation traces
verb 3
mute 20

# Write status info every 30 s
status /tmp/openvpn-tropic01.status 30

# ---------------------------------------------------------------------------
# Optional: run unprivileged after connect
# ---------------------------------------------------------------------------
# user  nobody
# group nogroup

# =============================================================================
# NOTES – provisioning keypair and certificate on TROPIC01
# =============================================================================
#
# 1. Generate ECC P-256 keypair in TROPIC01 ECC slot 0:
#       lt-util --generate-key --slot 0
#    or via PKCS#11:
#       pkcs11-tool --module /usr/lib/libtropic_pkcs11.so \
#                   --login --pin '' \
#                   --keypairgen --key-type EC:prime256v1 \
#                   --id 01 --label client-key
#
# 2. Export the public key and submit a CSR to your CA:
#       pkcs11-tool --module /usr/lib/libtropic_pkcs11.so \
#                   --read-object --type pubkey --id 01 \
#                   -o client-pubkey.der
#       openssl req -new -key "pkcs11:id=%01;type=public" \
#                   -engine pkcs11 -keyform engine \
#                   -subj "/CN=openwrt-client" \
#                   -out client.csr
#
# 3. Have the CSR signed by your VPN CA; store the resulting DER cert
#    in TROPIC01 R-MEM slot 0 (444 bytes max for DER-encoded leaf cert):
#       lt-util --write-data --slot 0 --file client.cer.der
#    or via PKCS#11:
#       pkcs11-tool --module /usr/lib/libtropic_pkcs11.so \
#                   --write-object client.cer.der --type cert \
#                   --id 01 --label client-cert
#
# 4. Update the pkcs11-id line in this file to match the URI reported by
#       pkcs11-tool --module /usr/lib/libtropic_pkcs11.so -O
#
# =============================================================================
