name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint

  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox
      - run: make test

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-links.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks command-line tool, not gitleaks-action: the action needs a paid
      # license for organization-owned repositories, the tool does not. Pinned and
      # checked against its published sha256.
      - name: Install gitleaks
        run: |
          v=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "${sum}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the history for secrets
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  patches-apply:
    # Cheap early warning: do our OpenWrt patches still apply to the pin?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check openwrt-patches against the pinned upstream revision
        run: |
          . ./openwrt.pin
          git init -q openwrt && cd openwrt
          git remote add origin "$OPENWRT_URL"
          git fetch -q --depth 1 origin "$OPENWRT_COMMIT"
          git checkout -q FETCH_HEAD
          for p in ../openwrt-patches/*.patch; do
            [ -e "$p" ] || continue
            echo "checking $p"; git apply --check "$p"
          done
