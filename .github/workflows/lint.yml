name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint

  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox
      - run: make test

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-links.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  patches-apply:
    # Cheap early warning: do our OpenWrt patches still apply to the pin?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check openwrt-patches against the pinned upstream revision
        run: |
          . ./openwrt.pin
          git init -q openwrt && cd openwrt
          git remote add origin "$OPENWRT_URL"
          git fetch -q --depth 1 origin "$OPENWRT_COMMIT"
          git checkout -q FETCH_HEAD
          for p in ../openwrt-patches/*.patch; do
            [ -e "$p" ] || continue
            echo "checking $p"; git apply --check "$p"
          done
